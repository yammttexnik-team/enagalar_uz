# Lokal ishlab chiqish uchun xizmatlar: PostgreSQL, Redis, Meilisearch, Mailpit.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enagalar
      POSTGRES_USER: enagalar
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: masterKey
    ports: ["7700:7700"]
    volumes: [meili:/meili_data]

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  meili:
