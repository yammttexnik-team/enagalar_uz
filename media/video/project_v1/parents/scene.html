  cue(17.0, 'transition', 1); cue(17.65, 'sub', .45);

scene.update = (t) => {

  ['A', 'B', 'C', 'D'].forEach(k => R[k].style.display = vis(k) ? '' : 'none');
  R.bg.warm.style.opacity = (.22 * p(t, 17.5, 1.2)).toFixed(3);
  if (vis('A')) {

    R.bubs.forEach(({ b, r, i }) => {
      const q = p(t, .45 + i * .16, .55, 'outBack'), out = p(t, 2.8 + i * .03, .45, 'inCubic'), dir = (b.offsetLeft + 150 < 540 ? -1 : 1);
      tf(b, { x: dir * out * 700, y: Math.sin(t * 1.6 + i) * 7 - (1 - q) * 30, s: (.6 + .4 * q), r: r + Math.sin(t * 1.2 + i) * 1.5, o: p(t, .45 + i * .16, .15) * (1 - out), blur: out * 14 });
    });
    animWords(R.cap1, t, .35, 2.62, { lineStarts: [.35, .7, 1.0] });
    const mp = p(t, 3.0, .55, 'spring'); tf(R.markA.w, { s: mp, y: Math.sin(t * 2) * 6, o: p(t, 3.0, .1) });
    R.markA.set(p(t, 3.0, .6, 'outCubic'), p(t, 3.15, .4, 'outBack'), p(t, 3.3, .45, 'outBack'));
    animWords(R.cap2, t, 3.15, undefined, { lineStarts: [3.15, 3.4, 3.8] });
  }
  if (vis('B')) {
    animWords(R.capB1, t, 5.0, 6.8, { lineStarts: [5.0, 5.35] });
    animWords(R.capB2, t, 7.2, undefined, { lineStarts: [7.2, 7.5, 7.85] });
    const ph = p(t, 4.55, .9, 'outExpo'); tf(R.phone, { y: (1 - ph) * 160 + Math.sin(t * 1.4) * 5, o: ph, s: .94 + .06 * ph });
    tf(R.hdr, { y: (1 - p(t, 5.0, .6, 'outExpo')) * 30, o: p(t, 5.0, .3) });
    const setF = (F, tc, val) => {
      const on = t >= tc; F.v.textContent = on ? val : 'Tanlang'; F.v.style.color = on ? 'var(--s900)' : 'var(--s400)'; F.v.style.fontWeight = on ? 600 : 500;
      F.f.classList.toggle('on', t >= tc - .08 && t < tc + .5);
      const k = t >= tc && t < tc + .3 ? Math.sin(Math.PI * (t - tc) / .3) : 0; tf(F.v, { s: 1 + .06 * k });
    };
    setF(R.f1, 6.05, 'Toshkent shahri'); setF(R.f2, 6.7, 'Yunusobod tumani');
    const sOn = p(t, 7.72, .35, 'outBack'); tf(R.segOn, { o: p(t, 7.72, .12), s: .85 + .15 * sOn });
    R.segA.style.color = t >= 7.75 ? '#fff' : 'var(--s700)';
    R.segA.firstChild.innerHTML = t >= 7.75 ? B.ic.home(26, '#fff') : B.ic.home(26, '#504941');
    const bp = t > 8.25 && t < 8.5 ? Math.sin(Math.PI * (t - 8.25) / .25) : 0; tf(R.btnB, { s: 1 - .05 * bp });
    const rq = p(t, 8.4, .6, 'outExpo'); tf(R.res, { y: (1 - rq) * 720, o: p(t, 8.4, .1) });
    R.cards.forEach((cd, i) => { const q = p(t, 8.55 + i * .15, .6, 'outBack'); tf(cd, { y: (1 - q) * 80, o: p(t, 8.55 + i * .15, .2), s: .92 + .08 * q }); });
    R.cur.update(t, [[5.4, 1000, 1520], [5.95, 720, 875, 'outCubic'], [6.1, 720, 875], [6.6, 720, 1005, 'outCubic'], [7.2, 720, 1005], [7.65, 420, 1140, 'outCubic'], [7.85, 420, 1140], [8.25, 560, 1262, 'outCubic'], [8.6, 560, 1262], [9.1, 980, 1500, 'inCubic']], [6.0, 6.65, 7.7, 8.3], [5.4, 9.0]);
