name: Deploy

# main'dagi CI muvaffaqiyatli tugagach serverga avtomatik joylaydi.
# Qo'lda ishga tushirish: Actions → Deploy → Run workflow.
# Server avval "Server setup" workflow'i bilan sozlangan bo'lishi kerak.
# ESLATMA: hozircha `main` branch yo'q (yagona branch: ccr-93c85ef7-iqkyo9), shuning uchun avtomatik
# deploy ishlamaydi, faqat qo'lda (workflow_dispatch). `main` yaratilgach avtomatik yoqiladi.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Minimal huquq: workflow faqat kodni o'qiy oladi (serverga SSH orqali kiradi, GitHub API kerak emas).
permissions:
  contents: read

jobs:
  deploy:
    # Faqat shu repo'dagi push'dan chiqqan muvaffaqiyatli CI deploy qilinadi
    # (fork'dan yoki pull_request'dan kelgan workflow_run hech qachon deploy qilmaydi).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      # Ixtiyoriy: known_hosts qatori (TOFU'dan himoya). Bo'sh bo'lsa ssh-keyscan ishlatiladi.
      SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: SSH sozlash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SERVER_HOST_KEY:-}" ]; then printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts; fi

      - name: Kodni yuborish
        run: |
          git rev-parse HEAD > REVISION
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude .git --exclude node_modules --exclude vendor --exclude .nuxt --exclude .output \
            --exclude 'backend/.env' --exclude 'backend/storage' --exclude 'backend/database/*.sqlite' \
            --exclude 'deploy/.env.production' --exclude 'deploy/.caddyfile.sha' \
            ./ "deploy@$HOST:enagalar_uz/"

      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "deploy@$HOST" "cd enagalar_uz && ./deploy/scripts/deploy.sh --no-pull"

      - name: Tekshirish
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@$HOST" \
            'for i in $(seq 1 12); do curl -fsS -o /dev/null http://127.0.0.1:8095/up && { echo OK; exit 0; }; sleep 10; done; echo "Ichki port (8095) javob bermadi"; exit 1'

      - name: Kalitni o'chirish
        if: always()
        run: rm -f ~/.ssh/deploy_key
