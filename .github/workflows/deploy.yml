name: Deploy

# main'dagi CI muvaffaqiyatli tugagach serverga avtomatik joylaydi.
# Qo'lda ishga tushirish: Actions → Deploy → Run workflow.
# Server avval "Server setup" workflow'i bilan sozlangan bo'lishi kerak.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: SSH sozlash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts

      - name: Kodni yuborish
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude .git --exclude node_modules --exclude vendor --exclude .nuxt --exclude .output \
            --exclude 'backend/.env' --exclude 'backend/storage' --exclude 'backend/database/*.sqlite' \
            --exclude 'deploy/.env.production' \
            ./ "deploy@$HOST:enagalar_uz/"

      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "deploy@$HOST" "cd enagalar_uz && ./deploy/scripts/deploy.sh --no-pull"

      - name: Tekshirish
        run: |
          for i in $(seq 1 12); do
            if curl -fsSk --resolve "enagalar.uz:443:$HOST" -o /dev/null https://enagalar.uz/up; then echo "OK"; exit 0; fi
            sleep 10
          done
          echo "Server javob bermadi"; exit 1

      - name: Kalitni o'chirish
        if: always()
        run: rm -f ~/.ssh/deploy_key
