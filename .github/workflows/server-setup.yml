name: Server setup

# Bir martalik: yangi serverni sozlaydi va birinchi deployni qiladi.
# Ishga tushirish: Actions → Server setup → Run workflow.
# Kerakli secret'lar: docs/DEPLOY.md, "GitHub Actions orqali" bo'limi.
on:
  workflow_dispatch:
    inputs:
      run_server_setup:
        description: "Docker, firewall, fail2ban, deploy foydalanuvchisini o'rnatish (root paroli bilan)"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH sozlash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          sudo apt-get install -y -qq sshpass rsync >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub

      - name: Serverni sozlash (root)
        if: inputs.run_server_setup
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          sshpass -e scp deploy/scripts/server-setup.sh "root@$HOST:/root/server-setup.sh"
          sshpass -e ssh "root@$HOST" "bash /root/server-setup.sh deploy '$(cat ~/.ssh/deploy_key.pub)'"

      - name: Kodni yuborish
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude .git --exclude node_modules --exclude vendor --exclude .nuxt --exclude .output \
            --exclude 'backend/.env' --exclude 'backend/storage' --exclude 'backend/database/*.sqlite' \
            --exclude 'deploy/.env.production' \
            ./ "deploy@$HOST:enagalar_uz/"

      - name: .env.production yaratish (bo'lmasa)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACME_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          if ssh -i ~/.ssh/deploy_key "deploy@$HOST" test -f enagalar_uz/deploy/.env.production; then
            echo "Mavjud, o'zgartirilmadi."; exit 0
          fi
          umask 077
          python3 - <<'PY'
          import base64, os, re, secrets
          s = open('deploy/.env.production.example').read()
          s = re.sub(r'CHANGE_ME_\w+', lambda m: secrets.token_hex(24), s)
          s = re.sub(r'(?m)^APP_KEY=.*$', 'APP_KEY=base64:' + base64.b64encode(os.urandom(32)).decode(), s)
          for k in ('TELEGRAM_BOT_TOKEN', 'ANTHROPIC_API_KEY', 'ACME_EMAIL'):
              s = re.sub(rf'(?m)^{k}=.*$', f'{k}={os.environ[k]}', s)
          open('/tmp/.env.production', 'w').write(s)
          PY
          ssh -i ~/.ssh/deploy_key "deploy@$HOST" "umask 077; cat > enagalar_uz/deploy/.env.production" < /tmp/.env.production
          rm -f /tmp/.env.production

      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "deploy@$HOST" "cd enagalar_uz && ./deploy/scripts/deploy.sh --no-pull"

      - name: Admin yaratish
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          printf '%s' "$ADMIN_PASSWORD" | ssh -i ~/.ssh/deploy_key "deploy@$HOST" \
            "cd enagalar_uz/deploy && docker compose --env-file .env.production -f docker-compose.prod.yml exec -T app php artisan admin:create '$ADMIN_EMAIL' Admin --password-stdin"

      - name: Tekshirish
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@$HOST" \
            'for i in $(seq 1 12); do curl -fsS -o /dev/null http://127.0.0.1:8095/up && { echo OK; exit 0; }; sleep 10; done; echo "Ichki port (8095) javob bermadi"; exit 1'

      - name: Kalitni o'chirish
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_key.pub
